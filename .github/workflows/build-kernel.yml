name: Build RPi Kernel for Fedora

on:
  schedule:
    - cron: '0 22 * * *'  # Daily at 22:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new stable version'
        type: boolean
        default: false
      target:
        description: 'Copr build target'
        type: choice
        options:
          - testing
          - stable
        default: testing

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version_changed: ${{ steps.check.outputs.version_changed }}
      kernel_version: ${{ steps.check.outputs.kernel_version }}
      rpi_version: ${{ steps.versions.outputs.rpi_version }}
      rpi_patchlevel: ${{ steps.versions.outputs.rpi_patchlevel }}
      rpi_sublevel: ${{ steps.versions.outputs.rpi_sublevel }}
      rpi_git_short: ${{ steps.versions.outputs.rpi_git_short }}
      rpi_git_full: ${{ steps.versions.outputs.rpi_git_full }}
      patch_file: ${{ steps.versions.outputs.patch_file }}

    steps:
      - name: Checkout spec repo
        uses: actions/checkout@v6

      - name: Clone RPi kernel tree
        run: |
          git clone https://github.com/raspberrypi/linux \
            --branch rpi-6.18.y \
            --depth 500 \
            --no-single-branch \
            --filter=blob:none

      - name: Extract versions
        id: versions
        run: |
          cd linux
          RPI_VERSION=$(grep "^VERSION" Makefile | awk '{print $3}')
          RPI_PATCHLEVEL=$(grep "^PATCHLEVEL" Makefile | awk '{print $3}')
          RPI_SUBLEVEL=$(grep "^SUBLEVEL" Makefile | awk '{print $3}')
          RPI_GIT_SHORT=$(git rev-parse --short=9 HEAD)
          RPI_GIT_FULL=$(git rev-parse HEAD)

          echo "rpi_version=${RPI_VERSION}" >> $GITHUB_OUTPUT
          echo "rpi_patchlevel=${RPI_PATCHLEVEL}" >> $GITHUB_OUTPUT
          echo "rpi_sublevel=${RPI_SUBLEVEL}" >> $GITHUB_OUTPUT
          echo "rpi_git_short=${RPI_GIT_SHORT}" >> $GITHUB_OUTPUT
          echo "rpi_git_full=${RPI_GIT_FULL}" >> $GITHUB_OUTPUT
          echo "kernel_version=${RPI_VERSION}.${RPI_PATCHLEVEL}.${RPI_SUBLEVEL}" >> $GITHUB_OUTPUT
          echo "patch_file=bcm270x-linux-rpi-${RPI_VERSION}.${RPI_PATCHLEVEL}.y-${RPI_GIT_SHORT}.patch.xz" >> $GITHUB_OUTPUT

      - name: Check if build is needed
        id: check
        run: |
          SPEC_SUBLEVEL=$(grep '^%define stable_update' kernel.spec | awk '{print $3}')
          TREE_VERSION="${{ steps.versions.outputs.kernel_version }}"

          if [ "${{ github.event.inputs.target }}" = "stable" ]; then
            # Promotion: build the spec exactly as committed by the testing run,
            # regardless of any newer upstream version that appeared since.
            echo "Stable promotion. Building spec as committed (SUBLEVEL=${SPEC_SUBLEVEL})."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "kernel_version=${{ steps.versions.outputs.rpi_version }}.${{ steps.versions.outputs.rpi_patchlevel }}.${SPEC_SUBLEVEL}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "kernel_version=${TREE_VERSION}" >> $GITHUB_OUTPUT

          if [ "$SPEC_SUBLEVEL" != "${{ steps.versions.outputs.rpi_sublevel }}" ]; then
            echo "New stable version detected: $SPEC_SUBLEVEL -> ${{ steps.versions.outputs.rpi_sublevel }}. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version_changed=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "Force build requested. Proceeding without spec update."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "No new stable version (SUBLEVEL=${SPEC_SUBLEVEL}). Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch mainline stable tag
        if: steps.check.outputs.version_changed == 'true'
        run: |
          cd linux
          git remote add mainline \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch mainline \
            tag v${{ steps.versions.outputs.kernel_version }} \
            --no-tags

      - name: Generate RPi patch
        if: steps.check.outputs.version_changed == 'true'
        run: |
          cd linux
          git diff v${{ steps.versions.outputs.kernel_version }} HEAD \
            | xz -9 > ../${{ steps.versions.outputs.patch_file }}

      - name: Update spec file
        if: steps.check.outputs.version_changed == 'true'
        run: |
          OLD_HASH=$(grep '%global rpi_gitshort' kernel.spec | awk '{print $3}')
          OLD_SUBLEVEL=$(grep '^%define stable_update' kernel.spec | awk '{print $3}')
          OLD_BASERELEASE=$(grep '^%global baserelease' kernel.spec | awk '{print $3}')

          sed -i "s/%global rpi_gitshort ${OLD_HASH}/%global rpi_gitshort ${{ steps.versions.outputs.rpi_git_short }}/" kernel.spec
          sed -i "s/%define stable_update ${OLD_SUBLEVEL}/%define stable_update ${{ steps.versions.outputs.rpi_sublevel }}/" kernel.spec
          sed -i "s/%global baserelease ${OLD_BASERELEASE}/%global baserelease 1/" kernel.spec

      - name: Update spec changelog
        if: steps.check.outputs.version_changed == 'true'
        run: |
          CHANGELOG_DATE=$(date "+%a %b %-d %Y")
          CHANGELOG_ENTRY="* ${CHANGELOG_DATE} ${{ vars.CHANGELOG_NAME }} <${{ vars.CHANGELOG_EMAIL }}> - ${{ steps.versions.outputs.kernel_version }}-1.rpi\n- Update to stable kernel patch v${{ steps.versions.outputs.kernel_version }}\n- Sync RPi patch to git revision: ${{ steps.versions.outputs.rpi_git_full }}\n"
          sed -i "/%changelog/a ${CHANGELOG_ENTRY}" kernel.spec

      - name: Commit and push changes
        if: steps.check.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          OLD_PATCH=$(git ls-files 'bcm270x-linux-rpi*.patch.xz')
          if [ -n "$OLD_PATCH" ] && [ "$OLD_PATCH" != "${{ steps.versions.outputs.patch_file }}" ]; then
            git rm "$OLD_PATCH"
          fi
          git add kernel.spec ${{ steps.versions.outputs.patch_file }}

          git commit -m "Update to stable kernel patch v${{ steps.versions.outputs.kernel_version }}" \
            -m "Sync RPi patch to git revision: ${{ steps.versions.outputs.rpi_git_full }}" \
            -m "Signed-off-by: ${{ vars.CHANGELOG_NAME }} <${{ vars.CHANGELOG_EMAIL }}>"
          git push

  submit:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chroot: [fedora-43-aarch64, fedora-44-aarch64, fedora-45-aarch64]

    steps:
      - name: Install copr-cli
        run: |
          sudo apt-get install -y python3-pip
          pip3 install copr-cli

          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ vars.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Set Copr target
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" = "stable" ]; then
            echo "COPR_TARGET=${{ vars.COPR_USERNAME }}/${{ vars.COPR_REPO_STABLE }}" >> $GITHUB_ENV
          else
            echo "COPR_TARGET=${{ vars.COPR_USERNAME }}/${{ vars.COPR_REPO_TESTING }}" >> $GITHUB_ENV
          fi

      - name: Submit all flavours for ${{ matrix.chroot }}
        run: |
          CHROOT="${{ env.COPR_TARGET }}/${{ matrix.chroot }}"

          submit_flavour() {
            local NAME=$1
            local WITH_OPTS=$2

            copr-cli edit-chroot ${CHROOT} --reset with_opts
            if [ -n "$WITH_OPTS" ]; then
              copr-cli edit-chroot ${CHROOT} --rpmbuild-with $WITH_OPTS
            fi
            BUILD_ID=$(copr-cli build-package \
              --timeout 18000 \
              --enable-net on \
              --nowait \
              --chroot ${{ matrix.chroot }} \
              --name $NAME \
              ${{ env.COPR_TARGET }} | grep "Created builds:" | awk '{print $3}')
            echo "Waiting for build $BUILD_ID ($NAME) to start in ${{ matrix.chroot }}..."
            while true; do
              STATE=$(curl -s "https://copr.fedorainfracloud.org/api_3/build-chroot/list?build_id=${BUILD_ID}" \
                | python3 -c "import sys,json; items=json.load(sys.stdin).get('items',[]); print(items[0]['state'] if items else 'waiting')" 2>/dev/null)
              echo "  state: $STATE"
              case "$STATE" in
                running|succeeded|failed|skipped|canceled|forked)
                  echo "  Build is $STATE, waiting 60s for builder to fetch with_opts before resetting..."
                  sleep 60
                  break
                  ;;
              esac
              sleep 10
            done
            copr-cli edit-chroot ${CHROOT} --reset with_opts
            echo $BUILD_ID > build_id_${{ matrix.chroot }}_${NAME}.txt
          }

          submit_flavour kernel ""
          submit_flavour kernel-rpi4 rpi4
          submit_flavour kernel-rpi5 rpi5

      - name: Upload build IDs
        uses: actions/upload-artifact@v7
        with:
          name: build-ids-${{ matrix.chroot }}
          path: build_id_${{ matrix.chroot }}_*.txt

  monitor:
    needs: submit
    runs-on: ubuntu-latest
    steps:
      - name: Install copr-cli
        run: |
          sudo apt-get install -y python3-pip
          pip3 install copr-cli

          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ vars.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Download build IDs
        uses: actions/download-artifact@v8
        with:
          pattern: build-ids-*
          merge-multiple: true

      - name: Monitor builds
        run: |
          FAILED=false

          monitor_build() {
            BUILD_ID=$1
            NAME=$2
            echo "Monitoring $NAME (build $BUILD_ID)..."
            while true; do
              STATUS=$(copr-cli status $BUILD_ID)
              echo "  $NAME ($BUILD_ID): $STATUS"
              if [ "$STATUS" = "succeeded" ] || [ "$STATUS" = "failed" ]; then
                echo "$STATUS" > result_${BUILD_ID}.txt
                break
              fi
              sleep 60
            done
          }

          for FILE in build_id_*.txt; do
            BUILD_ID=$(cat $FILE)
            NAME=$(basename $FILE .txt | sed 's/build_id_//')
            monitor_build $BUILD_ID $NAME &
          done
          wait

          for FILE in result_*.txt; do
            STATUS=$(cat $FILE)
            if [ "$STATUS" = "failed" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

      - name: Regenerate Copr repo metadata
        if: success()
        run: |
          if [ "${{ github.event.inputs.target }}" = "stable" ]; then
            copr-cli regenerate-repos ${{ vars.COPR_USERNAME }}/${{ vars.COPR_REPO_STABLE }}
          else
            copr-cli regenerate-repos ${{ vars.COPR_USERNAME }}/${{ vars.COPR_REPO_TESTING }}
          fi

  promote:
    needs: [check, monitor]
    if: needs.monitor.result == 'success' && github.event.inputs.target != 'stable'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue stable build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build-kernel.yml \
            --ref ${{ github.ref_name }} \
            -f target=stable

  notify:
    needs: [check, monitor]
    if: always() && needs.monitor.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for testing build
        if: needs.check.outputs.version_changed == 'true' && github.event.inputs.target != 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.check.outputs.kernel_version }}"
          gh issue create \
            --title "Kernel v${VERSION} built in kernel-rpi-testing - promoting to stable" \
            --body "$(cat <<EOF
          ## Kernel v${VERSION} built in testing

          A new kernel version has been detected and successfully built in **kernel-rpi-testing**.

          **Version:** v${VERSION}
          **RPi git commit:** ${{ needs.check.outputs.rpi_git_full }}

          A stable build has been queued automatically. This issue will be closed when it succeeds.
          EOF
          )"

      - name: Close issue when promoted to stable
        if: github.event.inputs.target == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.check.outputs.kernel_version }}"
          ISSUE=$(gh issue list \
            --search "Kernel v${VERSION} built in kernel-rpi-testing in:title" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" \
              --comment "Promoted to stable (v${VERSION}). Closing."
          else
            echo "No open issue found for v${VERSION}, nothing to close."
          fi
